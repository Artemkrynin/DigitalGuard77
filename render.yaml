services:
  - type: web
    name: digitalguard
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd .. && rm -rf backend/static && cp -r frontend/dist backend/static"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DIGITALGUARD_SECRET
        generateValue: true
